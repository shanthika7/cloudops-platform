name: CloudOps CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bankappdb
        ports:
          - 3306:3306


    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Application Jar
        run: mvn -f application/bank-app/pom.xml clean package

      - name: Build Docker Image
        run: docker build -t bank-app:ci application/bank-app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bank-app:ci
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login To Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker Image
        run: |
          docker tag bank-app:ci 668216280078.dkr.ecr.us-east-1.amazonaws.com/bank-app:latest

      - name: Push Docker Image To ECR
        run: |
          docker push 668216280078.dkr.ecr.us-east-1.amazonaws.com/bank-app:latest


