name: CloudOps CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "668216280078"
  ECR_REPOSITORY: bank-app
  ECS_CLUSTER: cloudops-cluster
  ECS_SERVICE: bank-app-service
  ALB_NAME: cloudops-alb

jobs:

  # ==========================================================
  # STAGE 1: BUILD
  # ==========================================================
  build:
    name: 1 - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: application/bank-app/pom.xml

      - name: Compile Application
        run: |
          mvn \
            -f application/bank-app/pom.xml \
            clean compile \
            -DskipTests


  # ==========================================================
  # STAGE 2: TEST
  # ==========================================================
  test:
    name: 2 - Test
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bankappdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: application/bank-app/pom.xml

      - name: Run Automated Tests
        env:
          DB_HOST: 127.0.0.1
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: |
          mvn \
            -f application/bank-app/pom.xml \
            test


  # ==========================================================
  # STAGE 3: CODE QUALITY
  # ==========================================================
  code-quality:
    name: 3 - Code Quality
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: application/bank-app/pom.xml

      - name: Run PMD Code Quality Analysis
        run: |
          mvn \
            -f application/bank-app/pom.xml \
            pmd:check


  # ==========================================================
  # STAGE 4: BUILD CONTAINER
  # ==========================================================
  build-container:
    name: 4 - Build Container
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - code-quality

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: application/bank-app/pom.xml

      - name: Package Application JAR
        run: |
          mvn \
            -f application/bank-app/pom.xml \
            clean package \
            -DskipTests

      - name: Build Docker Image
        run: |
          docker build \
            --tag bank-app:${{ github.sha }} \
            application/bank-app

      - name: Save Docker Image
        run: |
          docker save \
            bank-app:${{ github.sha }} \
            --output bank-app-image.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-app-image
          path: bank-app-image.tar
          retention-days: 1


  # ==========================================================
  # STAGE 5: SECURITY SCAN
  # ==========================================================
  security-scan:
    name: 5 - Security Scan
    runs-on: ubuntu-latest
    needs: build-container

    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: bank-app-image

      - name: Load Docker Image
        run: |
          docker load --input bank-app-image.tar

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bank-app:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"


  # ==========================================================
  # STAGE 6: PUBLISH TO AMAZON ECR
  # Runs only after a push to master.
  # Pull requests do not publish images.
  # ==========================================================
  publish-image:
    name: 6 - Publish to ECR
    runs-on: ubuntu-latest
    needs: security-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: bank-app-image

      - name: Load Docker Image
        run: |
          docker load --input bank-app-image.tar

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag \
            bank-app:${{ github.sha }} \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          docker tag \
            bank-app:${{ github.sha }} \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Push Versioned Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push Latest Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest


  # ==========================================================
  # STAGE 7: DEPLOY TO AMAZON ECS
  # ==========================================================
  deploy-ecs:
    name: 7 - Deploy to ECS
    runs-on: ubuntu-latest
    needs: publish-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    environment:
      name: production

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force New ECS Deployment
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"

      - name: Wait for ECS Service Stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}"


  # ==========================================================
  # STAGE 8: VERIFY DEPLOYMENT
  # ==========================================================
  verify-deployment:
    name: 8 - Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy-ecs

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obtain Application Load Balancer DNS
        id: alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ env.ALB_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "LoadBalancers[0].DNSName" \
            --output text)

          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"

      - name: Verify Health Endpoint
        env:
          ALB_DNS: ${{ steps.alb.outputs.alb_dns }}
        run: |
          echo "Testing http://$ALB_DNS/health"

          for attempt in {1..10}; do
            RESPONSE=$(curl \
              --silent \
              --show-error \
              --fail \
              --max-time 10 \
              "http://$ALB_DNS/health" || true)

            if [ "$RESPONSE" = "UP" ]; then
              echo "Smoke test passed: /health returned UP"
              exit 0
            fi

            echo "Health verification attempt $attempt failed"
            sleep 15
          done

          echo "Smoke test failed: /health did not return UP"
          exit 1